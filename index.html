<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b1020; color: #fff;
           display: flex; justify-content: center; padding-top: 80px; }
    form { width: 320px; background: #141a2e; padding: 24px; border-radius: 10px; }
    label { display: block; margin: 12px 0 5px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px;
            border: 1px solid #2a3350; background: #0b1020; color: #fff; }
    button { width: 100%; margin-top: 18px; padding: 10px; border: 0;
             border-radius: 6px; background: #3b4a8a; color: #fff; cursor: pointer; }
    .error { background: #3a1620; color: #ff9aa8; padding: 10px;
             border-radius: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <form method="POST" action="/login">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <label>Имя пользователя</label>
    <input type="text" name="username" required>

    <label>Пароль</label>
    <input type="password" name="password" required>

    <button type="submit">Войти</button>
  </form>
</body>
</html>
